name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Prerelease tags (v0.1.2-rc1) still get built and tested by the job above,
  # but are never published — cutting a formal release stays a deliberate act.
  release:
    needs: test
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Asset names must stay in step with assetName() in update.go, which is
      # what `jat update` asks the release for.
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=${GITHUB_SHA::7}
          go build -ldflags "-X github.com/gostega/jat-util/cli.Version=${VERSION} -X github.com/gostega/jat-util/cli.Commit=${COMMIT}" \
            -o jat-${{ matrix.goos }}-${{ matrix.goarch }} .

      - uses: softprops/action-gh-release@v2
        with:
          files: jat-${{ matrix.goos }}-${{ matrix.goarch }}
          generate_release_notes: true
